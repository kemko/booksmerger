[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "bookmerger"
version = "0.1.0"
description = "Build an EPUB collection from FB2 and EPUB sources"
requires-python = ">=3.12"
dependencies = [
  "EpubMerge @ https://github.com/JimmXinu/EpubMerge/archive/8cc76632722a94abc2ad08ff0f5cbda83ffb96eb.tar.gz",
  "httpx>=0.28.1",
  "lxml>=6.1.3",
  "tinycss2>=1.5.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
bookmerger = "bookmerger.cli:main"

[dependency-groups]
dev = [
  "EbookLib>=0.20",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["bookmerger"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501", "UP012"]
